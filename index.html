<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Perjadin — Tabel Pivot Dinamis</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00A896;
      --primary-hover: #008778;
      --primary-light: #e6f7f5;
      --primary-border: #99dcd4;
      --accent-lime: #7BC143;
      --accent-lime-light: #f2f9ec;
      --surface: #ffffff;
      --bg: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --header-bg: #f8fafc;
      --header-group-bg: #e6f7f5;
      --total-col-bg: #f8fafc;
      --hover-row: #f1f5f9;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      background-color: var(--bg);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      background: var(--surface);
      padding: 24px 28px;
      border-radius: 14px;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
      border: 1px solid var(--border);
      border-top: 4px solid var(--primary);
    }

    /* Header & KPI Strip */
    .header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .title-group h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .title-group p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .kpi-strip {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .kpi-badge {
      background: var(--header-bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .kpi-badge strong {
      color: var(--text-main);
      font-weight: 600;
      font-size: 13px;
      margin-left: 4px;
    }

    button.refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 168, 150, 0.25);
    }

    button.refresh-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button.refresh-btn:active {
      transform: translateY(0);
    }

    /* Controls Panel */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 24px;
      align-items: center;
      padding: 16px 18px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 18px;
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .control-label {
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-right: 4px;
    }

    select, input[type="text"] {
      padding: 7px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-main);
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 168, 150, 0.15);
    }

    /* Animated Rounded-Square Tickboxes inside Rounded-Rectangle Label */
    .checkbox-wrapper-15 {
      display: inline-flex;
      align-items: center;
    }

    .checkbox-wrapper-15 .cbx {
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      padding: 5px 11px 5px 7px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      transition: all 0.15s ease;
    }

    .checkbox-wrapper-15 .cbx:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .checkbox-wrapper-15 .inp-cbx:checked + .cbx {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .checkbox-wrapper-15 .cbx span {
      display: inline-block;
      vertical-align: middle;
      transform: translate3d(0, 0, 0);
    }

    .checkbox-wrapper-15 .cbx span:first-child {
      position: relative;
      width: 19px;
      height: 19px;
      border-radius: 5px;
      transform: scale(1);
      vertical-align: middle;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      transition: all 0.2s ease;
    }

    .checkbox-wrapper-15 .cbx span:first-child svg {
      position: absolute;
      z-index: 1;
      top: 4px;
      left: 3px;
      width: 11px;
      height: 8px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 16px;
      stroke-dashoffset: 16px;
      transition: all 0.3s ease;
      transition-delay: 0.1s;
      transform: translate3d(0, 0, 0);
    }

    .checkbox-wrapper-15 .cbx span:first-child:before {
      content: "";
      width: 100%;
      height: 100%;
      background: var(--primary);
      display: block;
      transform: scale(0);
      opacity: 1;
      border-radius: 5px;
      transition-delay: 0.2s;
    }

    .checkbox-wrapper-15 .cbx span:last-child {
      margin-left: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      transition: color 0.2s ease;
    }

    .checkbox-wrapper-15 .cbx:hover span:first-child {
      border-color: var(--primary-hover);
    }

    .checkbox-wrapper-15 .inp-cbx:checked + .cbx span:first-child {
      border-color: var(--primary-hover);
      background: var(--primary);
      animation: check-15 0.5s ease;
    }

    .checkbox-wrapper-15 .inp-cbx:checked + .cbx span:first-child svg {
      stroke-dashoffset: 0;
    }

    .checkbox-wrapper-15 .inp-cbx:checked + .cbx span:first-child:before {
      transform: scale(2);
      opacity: 0;
      transition: all 0.5s ease;
    }

    .checkbox-wrapper-15 .inp-cbx:checked + .cbx span:last-child {
      color: var(--primary-hover);
      font-weight: 600;
    }

    @keyframes check-15 {
      50% {
        transform: scale(1.16);
      }
    }

    .search-box {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .search-box input {
      padding-right: 28px;
      min-width: 220px;
    }

    .clear-search {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: none;
      padding: 0 4px;
    }

    .clear-search:hover {
      color: var(--text-main);
    }

    /* Table Styling */
    .table-wrapper {
      overflow: auto;
      max-height: 70vh;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
    }

    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }

    th:last-child, td:last-child {
      border-right: none;
    }

    th {
      background-color: var(--header-bg);
      font-weight: 600;
      color: #1e293b;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 2;
      user-select: none;
    }

    th.group-header {
      background-color: var(--header-group-bg);
      color: #006b5f;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    th.group-header.total-group {
      background-color: var(--accent-lime-light);
      color: #3f6d1b;
    }

    thead tr:nth-child(2) th {
      top: 37px;
    }

    /* Sortable Headers */
    th.sortable {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    th.sortable:hover {
      background-color: #e2e8f0;
    }

    th.sortable.active-sort {
      background-color: #ccf0ec;
      color: var(--primary-hover);
    }

    .sort-icon {
      display: inline-block;
      margin-left: 6px;
      font-size: 11px;
      color: #94a3b8;
      vertical-align: middle;
    }

    th.sortable.active-sort .sort-icon {
      color: var(--primary);
      font-weight: 700;
    }

    /* Sticky First Column (Nama - reduced width with ellipsis) */
    th.sticky-col-1, td.sticky-col-1 {
      position: sticky;
      left: 0;
      z-index: 3;
      text-align: left;
      border-right: 2px solid #cbd5e1;
      width: 240px;
      min-width: 240px;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    td.sticky-col-1 {
      background: #fff;
      font-weight: 500;
      color: var(--text-main);
    }

    th.sticky-col-1 {
      background: var(--header-bg);
      z-index: 5;
    }

    /* NIP Column (Monospace & Fit Content) */
    th.nip-col, td.nip-col {
      width: 1%;
      white-space: nowrap;
    }

    td.nip-col {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      color: #64748b;
    }

    /* Clickable Participant Name with Ellipsis */
    .participant-link {
      color: var(--primary-hover);
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .participant-name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1 1 auto;
      min-width: 0;
    }

    .participant-link:hover .participant-name-text {
      color: var(--primary);
      text-decoration: underline;
    }

    .trip-pill {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      background: var(--accent-lime-light);
      color: #4d8024;
      border: 1px solid #cce7b5;
      padding: 1px 7px;
      border-radius: 999px;
    }

    tbody tr:nth-child(even) td {
      background-color: #fcfcfd;
    }

    tbody tr:nth-child(even) td.sticky-col-1 {
      background-color: #fcfcfd;
    }

    tbody tr:hover td,
    tbody tr:hover td.sticky-col-1 {
      background-color: var(--primary-light);
    }

    td.num {
      text-align: right;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
      color: #334155;
    }

    td.num.zero {
      color: #cbd5e1;
    }

    td.total-col {
      background-color: #f8fafc;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Grand Total Footer */
    tr.grand-total-row td {
      font-weight: 700;
      background-color: #e2e8f0 !important;
      color: #0f172a;
      position: sticky;
      bottom: 0;
      z-index: 4;
      border-top: 2px solid var(--primary);
      border-bottom: none;
    }

    tr.grand-total-row td.sticky-col-1 {
      z-index: 6;
    }

    /* Status & Loader */
    #status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-muted);
      padding: 40px 20px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid #cbd5e1;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Participant Details Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 960px;
      max-height: 85vh;
      border-radius: 14px;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.25);
      border-top: 4px solid var(--primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalFadeIn 0.16s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(8px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      background: #f8fafc;
    }

    .modal-title h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-title span {
      display: inline-block;
      margin-top: 4px;
      font-size: 13px;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-muted);
    }

    .modal-close {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .modal-close:hover {
      background: var(--primary-light);
      color: var(--primary-hover);
      border-color: var(--primary);
    }

    .modal-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 24px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .modal-body {
      padding: 18px 24px 24px;
      overflow: auto;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .detail-table th {
      background: var(--header-group-bg);
      color: #006b5f;
      position: static;
      text-align: left;
      padding: 9px 12px;
      border: 1px solid var(--border);
    }

    .detail-table th.num {
      text-align: right;
    }

    .detail-table td {
      padding: 9px 12px;
      border: 1px solid var(--border);
    }

    .lokus-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      background: var(--primary-light);
      color: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div class="title-group">
        <h2>Rekap Perjalanan Dinas</h2>
        <p>Klik nama peserta untuk melihat rincian perjalanan • Klik judul kolom untuk mengurutkan</p>
      </div>
      <div class="header-actions">
        <div class="kpi-strip" id="kpiStrip" style="display:none;">
          <div class="kpi-badge">Peserta: <strong id="kpiParticipants">0</strong></div>
          <div class="kpi-badge">Total Perjalanan: <strong id="kpiTrips">0</strong></div>
          <div class="kpi-badge">Total Keseluruhan: <strong id="kpiTotal">Rp 0</strong></div>
        </div>
        <button class="refresh-btn" onclick="fetchSheetData()">
          <span>↻</span> Muat Ulang Data
        </button>
      </div>
    </div>

    <div class="controls">
      <!-- Dimensi Pengelompokan Kolom -->
      <div class="control-group">
        <span class="control-label">Kelompokkan</span>
        <select id="colDimension" onchange="resetSortAndRender()">
          <option value="helperMonth" selected>Bulan (HelperMonth)</option>
          <option value="lokus">Tujuan</option>
          <option value="none">Tanpa Pengelompokan (Ringkasan)</option>
        </select>
      </div>

      <!-- Kotak Centang Pemilihan Kolom Tambahan (Kolom Total selalu aktif di paling kanan) -->
      <div class="control-group">
        <span class="control-label">Kolom</span>

        <div class="checkbox-wrapper-15">
          <input class="inp-cbx" id="chkNip" type="checkbox" checked onchange="renderPivot()" style="display: none;"/>
          <label class="cbx" for="chkNip">
            <span>
              <svg width="12px" height="9px" viewBox="0 0 12 9">
                <polyline points="1 5 4 8 11 1"></polyline>
              </svg>
            </span>
            <span>NIP</span>
          </label>
        </div>

        <div class="checkbox-wrapper-15">
          <input class="inp-cbx metric-chk" id="chkUh" type="checkbox" value="uh" onchange="renderPivot()" style="display: none;"/>
          <label class="cbx" for="chkUh">
            <span>
              <svg width="12px" height="9px" viewBox="0 0 12 9">
                <polyline points="1 5 4 8 11 1"></polyline>
              </svg>
            </span>
            <span>UH (Rp)</span>
          </label>
        </div>

        <div class="checkbox-wrapper-15">
          <input class="inp-cbx metric-chk" id="chkTransport" type="checkbox" value="transport" onchange="renderPivot()" style="display: none;"/>
          <label class="cbx" for="chkTransport">
            <span>
              <svg width="12px" height="9px" viewBox="0 0 12 9">
                <polyline points="1 5 4 8 11 1"></polyline>
              </svg>
            </span>
            <span>Transport (Rp)</span>
          </label>
        </div>

        <div class="checkbox-wrapper-15">
          <input class="inp-cbx metric-chk" id="chkPenginapan" type="checkbox" value="penginapan" onchange="renderPivot()" style="display: none;"/>
          <label class="cbx" for="chkPenginapan">
            <span>
              <svg width="12px" height="9px" viewBox="0 0 12 9">
                <polyline points="1 5 4 8 11 1"></polyline>
              </svg>
            </span>
            <span>Penginapan 30%</span>
          </label>
        </div>

        <div class="checkbox-wrapper-15">
          <input class="inp-cbx metric-chk" id="chkDurasi" type="checkbox" value="durasi" onchange="renderPivot()" style="display: none;"/>
          <label class="cbx" for="chkDurasi">
            <span>
              <svg width="12px" height="9px" viewBox="0 0 12 9">
                <polyline points="1 5 4 8 11 1"></polyline>
              </svg>
            </span>
            <span>Durasi (Hari)</span>
          </label>
        </div>

        <div class="checkbox-wrapper-15">
          <input class="inp-cbx metric-chk" id="chkCount" type="checkbox" value="count" onchange="renderPivot()" style="display: none;"/>
          <label class="cbx" for="chkCount">
            <span>
              <svg width="12px" height="9px" viewBox="0 0 12 9">
                <polyline points="1 5 4 8 11 1"></polyline>
              </svg>
            </span>
            <span>Jumlah Perjadin</span>
          </label>
        </div>
      </div>

      <!-- Pencarian Peserta -->
      <div class="control-group">
        <span class="control-label">Filter</span>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Cari Nama atau NIP..." oninput="handleSearch()">
          <button class="clear-search" id="clearSearchBtn" onclick="clearSearch()" title="Hapus pencarian">&times;</button>
        </div>
      </div>
    </div>

    <div id="status"><div class="spinner"></div><span>Memuat data spreadsheet...</span></div>
    <div class="table-wrapper" id="tableContainer" style="display:none;">
      <table id="pivotTable"></table>
    </div>
  </div>

  <!-- Modal Rincian Perjalanan Peserta -->
  <div class="modal-backdrop" id="detailModal" onclick="handleBackdropClick(event)">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalParticipantName">
      <div class="modal-header">
        <div class="modal-title">
          <h3 id="modalParticipantName">Nama Peserta</h3>
          <span id="modalParticipantNip">NIP: -</span>
        </div>
        <button class="modal-close" onclick="closeDetailModal()" title="Tutup">&times;</button>
      </div>
      <div class="modal-summary" id="modalSummaryStrip"></div>
      <div class="modal-body">
        <table class="detail-table" id="modalDetailTable"></table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxnKC368E18uUWsiKqy1LAT1Cpp5OChatRnMi5LAx-QkleqGzLNcj28wLufZo7nb74yNA/exec';

    let rawData = [];

    // Status pengurutan: type berupa 'nama', 'nip', 'colMetric', atau 'totalMetric'
    let sortState = {
      type: 'nama',
      colKey: null,
      metric: null,
      dir: 'asc' // 'asc' | 'desc'
    };

    const METRIC_LABELS = {
      total: 'Total',
      uh: 'UH',
      transport: 'Transport',
      penginapan: 'Penginapan 30%',
      durasi: 'Durasi',
      count: 'Perjadin'
    };

    const MONTH_ORDER = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    const MONTH_ID_MAP = {
      January: 'Januari',
      February: 'Februari',
      March: 'Maret',
      April: 'April',
      May: 'Mei',
      June: 'Juni',
      July: 'Juli',
      August: 'Agustus',
      September: 'September',
      October: 'Oktober',
      November: 'November',
      December: 'Desember'
    };

    function formatGroupLabel(dim, key) {
      if (dim === 'helperMonth' && MONTH_ID_MAP[key]) {
        return MONTH_ID_MAP[key];
      }
      return key;
    }

    window.onload = fetchSheetData;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetailModal();
    });

    async function fetchSheetData() {
      const statusEl = document.getElementById('status');
      const tableContainer = document.getElementById('tableContainer');
      const kpiStrip = document.getElementById('kpiStrip');

      statusEl.style.display = 'flex';
      statusEl.innerHTML = '<div class="spinner"></div><span>Memuat data spreadsheet...</span>';
      tableContainer.style.display = 'none';
      kpiStrip.style.display = 'none';

      try {
        const response = await fetch(API_URL, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) {
          throw new Error('Kesalahan HTTP ' + response.status);
        }

        const result = await response.json();
        if (result.status !== 'success') {
          throw new Error(result.message || 'Gagal memproses data');
        }

        rawData = result.data;
        statusEl.style.display = 'none';
        tableContainer.style.display = 'block';
        kpiStrip.style.display = 'flex';
        renderPivot();
      } catch (err) {
        statusEl.innerHTML = `<span style="color:#dc2626;">Gagal memuat data: ${err.message}. Pastikan Web App Apps Script sudah di-deploy dengan akses "Anyone".</span>`;
      }
    }

    function handleSearch() {
      const val = document.getElementById('searchInput').value;
      document.getElementById('clearSearchBtn').style.display = val ? 'block' : 'none';
      renderPivot();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').style.display = 'none';
      renderPivot();
    }

    function resetSortAndRender() {
      sortState = { type: 'nama', colKey: null, metric: null, dir: 'asc' };
      renderPivot();
    }

    function toggleSort(type, colKey = null, metric = null) {
      if (
        sortState.type === type &&
        sortState.colKey === colKey &&
        sortState.metric === metric
      ) {
        sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      } else {
        sortState.type = type;
        sortState.colKey = colKey;
        sortState.metric = metric;
        sortState.dir = (type === 'nama' || type === 'nip') ? 'asc' : 'desc';
      }
      renderPivot();
    }

    function getSortIndicator(type, colKey = null, metric = null) {
      const isMatch =
        sortState.type === type &&
        sortState.colKey === colKey &&
        sortState.metric === metric;

      if (!isMatch) return '<span class="sort-icon">⇅</span>';
      return `<span class="sort-icon">${sortState.dir === 'asc' ? '▲' : '▼'}</span>`;
    }

    function isSortActive(type, colKey = null, metric = null) {
      return (
        sortState.type === type &&
        sortState.colKey === colKey &&
        sortState.metric === metric
      ) ? 'active-sort' : '';
    }

    function formatNumber(val) {
      if (!val || val === 0) return '-';
      return val.toLocaleString('id-ID');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function openParticipantModal(encodedName) {
      const nama = decodeURIComponent(encodedName);
      const trips = rawData.filter(r => r.nama === nama);
      if (trips.length === 0) return;

      const nip = trips.find(t => t.nip)?.nip || '-';
      document.getElementById('modalParticipantName').textContent = nama;
      document.getElementById('modalParticipantNip').textContent = `NIP: ${nip}`;

      const totals = trips.reduce((acc, t) => {
        acc.durasi += t.durasi;
        acc.uh += t.uh;
        acc.transport += t.transport;
        acc.penginapan += t.penginapan;
        acc.total += t.total;
        return acc;
      }, { durasi: 0, uh: 0, transport: 0, penginapan: 0, total: 0 });

      document.getElementById('modalSummaryStrip').innerHTML = `
        <div class="kpi-badge">Total Perjalanan: <strong>${trips.length}</strong></div>
        <div class="kpi-badge">Total Durasi: <strong>${totals.durasi} Hari</strong></div>
        <div class="kpi-badge">Total UH: <strong>Rp ${totals.uh.toLocaleString('id-ID')}</strong></div>
        <div class="kpi-badge">Total Transport: <strong>Rp ${totals.transport.toLocaleString('id-ID')}</strong></div>
        <div class="kpi-badge">Total Keseluruhan: <strong>Rp ${totals.total.toLocaleString('id-ID')}</strong></div>
      `;

      let detailHtml = `
        <thead>
          <tr>
            <th>No</th>
            <th>Bulan</th>
            <th>Tujuan</th>
            <th>Berangkat</th>
            <th>Pulang</th>
            <th class="num">Durasi</th>
            <th class="num">UH (Rp)</th>
            <th class="num">Transport (Rp)</th>
            <th class="num">Penginapan 30%</th>
            <th class="num">Total (Rp)</th>
          </tr>
        </thead>
        <tbody>
      `;

      trips.forEach((t, idx) => {
        const bulanId = MONTH_ID_MAP[t.helperMonth] || t.helperMonth;
        detailHtml += `
          <tr>
            <td>${idx + 1}</td>
            <td>${escapeHtml(bulanId)}</td>
            <td><span class="lokus-badge">${escapeHtml(t.lokus)}</span></td>
            <td>${escapeHtml(t.berangkat)}</td>
            <td>${escapeHtml(t.pulang)}</td>
            <td class="num">${formatNumber(t.durasi)}</td>
            <td class="num">${formatNumber(t.uh)}</td>
            <td class="num">${formatNumber(t.transport)}</td>
            <td class="num">${formatNumber(t.penginapan)}</td>
            <td class="num" style="font-weight:600;">${formatNumber(t.total)}</td>
          </tr>
        `;
      });

      detailHtml += `
        <tr style="background:#f1f5f9; font-weight:700;">
          <td colspan="5">Total (${trips.length} Perjalanan Dinas)</td>
          <td class="num">${formatNumber(totals.durasi)}</td>
          <td class="num">${formatNumber(totals.uh)}</td>
          <td class="num">${formatNumber(totals.transport)}</td>
          <td class="num">${formatNumber(totals.penginapan)}</td>
          <td class="num">${formatNumber(totals.total)}</td>
        </tr>
      </tbody>`;

      document.getElementById('modalDetailTable').innerHTML = detailHtml;
      document.getElementById('detailModal').classList.add('open');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('open');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'detailModal') {
        closeDetailModal();
      }
    }

    function renderPivot() {
      const colDim = document.getElementById('colDimension').value;
      const showNip = document.getElementById('chkNip').checked;
      const search = document.getElementById('searchInput').value.toLowerCase().trim();

      // Metrik tambahan yang dicentang ditampilkan lebih dulu, kolom 'total' selalu di paling kanan
      const extraMetrics = Array.from(document.querySelectorAll('.metric-chk:checked'))
        .map(cb => cb.value);
      const selectedMetrics = [...extraMetrics, 'total'];

      const table = document.getElementById('pivotTable');

      const filtered = rawData.filter(r =>
        !search || r.nama.toLowerCase().includes(search) || r.nip.toLowerCase().includes(search)
      );

      let colKeys = [];
      if (colDim !== 'none') {
        const keySet = new Set(filtered.map(r => r[colDim]));
        colKeys = Array.from(keySet);
        if (colDim === 'helperMonth') {
          colKeys.sort((a, b) => {
            const idxA = MONTH_ORDER.indexOf(a);
            const idxB = MONTH_ORDER.indexOf(b);
            if (idxA === -1 && idxB === -1) return a.localeCompare(b);
            if (idxA === -1) return 1;
            if (idxB === -1) return -1;
            return idxA - idxB;
          });
        } else {
          colKeys.sort();
        }
      }

      const participantsMap = new Map();
      filtered.forEach(row => {
        if (!participantsMap.has(row.nama)) {
          participantsMap.set(row.nama, {
            nama: row.nama,
            nip: row.nip,
            byCol: {},
            rowTotals: { total: 0, uh: 0, transport: 0, penginapan: 0, durasi: 0, count: 0 }
          });
        }
        const p = participantsMap.get(row.nama);
        if (!p.nip && row.nip) p.nip = row.nip;

        const cKey = colDim === 'none' ? 'ALL' : row[colDim];
        if (!p.byCol[cKey]) {
          p.byCol[cKey] = { total: 0, uh: 0, transport: 0, penginapan: 0, durasi: 0, count: 0 };
        }

        ['total', 'uh', 'transport', 'penginapan', 'durasi'].forEach(m => {
          p.byCol[cKey][m] += row[m];
          p.rowTotals[m] += row[m];
        });
        p.byCol[cKey].count += 1;
        p.rowTotals.count += 1;
      });

      // Terapkan Pengurutan Dinamis
      const participants = Array.from(participantsMap.values()).sort((a, b) => {
        let cmp = 0;
        if (sortState.type === 'nama') {
          cmp = a.nama.localeCompare(b.nama);
        } else if (sortState.type === 'nip') {
          cmp = (a.nip || '').localeCompare(b.nip || '');
        } else if (sortState.type === 'colMetric') {
          const valA = (a.byCol[sortState.colKey] && a.byCol[sortState.colKey][sortState.metric]) || 0;
          const valB = (b.byCol[sortState.colKey] && b.byCol[sortState.colKey][sortState.metric]) || 0;
          cmp = valA - valB;
        } else if (sortState.type === 'totalMetric') {
          const valA = a.rowTotals[sortState.metric] || 0;
          const valB = b.rowTotals[sortState.metric] || 0;
          cmp = valA - valB;
        }

        if (cmp === 0) cmp = a.nama.localeCompare(b.nama);
        return sortState.dir === 'asc' ? cmp : -cmp;
      });

      // Bangun Header Tabel
      const rowSpan = colDim === 'none' ? 1 : 2;
      let thead = '<thead><tr>';
      thead += `<th class="sticky-col-1 sortable ${isSortActive('nama')}" rowspan="${rowSpan}" onclick="toggleSort('nama')">
                  Nama ${getSortIndicator('nama')}
                </th>`;

      if (showNip) {
        thead += `<th class="nip-col sortable ${isSortActive('nip')}" rowspan="${rowSpan}" onclick="toggleSort('nip')">
                    NIP ${getSortIndicator('nip')}
                  </th>`;
      }

      if (colDim === 'none') {
        selectedMetrics.forEach(m => {
          thead += `<th class="sortable ${isSortActive('totalMetric', null, m)}" onclick="toggleSort('totalMetric', null, '${m}')">
                      ${METRIC_LABELS[m]} ${getSortIndicator('totalMetric', null, m)}
                    </th>`;
        });
      } else {
        colKeys.forEach(ck => {
          thead += `<th class="group-header" colspan="${selectedMetrics.length}">${escapeHtml(formatGroupLabel(colDim, ck))}</th>`;
        });
        thead += `<th class="group-header total-group" colspan="${selectedMetrics.length}">Total Keseluruhan</th>`;
        thead += '</tr><tr>';

        colKeys.forEach(ck => {
          const safeCk = ck.replace(/'/g, "\\'");
          selectedMetrics.forEach(m => {
            thead += `<th class="sortable ${isSortActive('colMetric', ck, m)}" onclick="toggleSort('colMetric', '${safeCk}', '${m}')">
                        ${METRIC_LABELS[m]} ${getSortIndicator('colMetric', ck, m)}
                      </th>`;
          });
        });

        selectedMetrics.forEach(m => {
          thead += `<th class="sortable ${isSortActive('totalMetric', null, m)}" onclick="toggleSort('totalMetric', null, '${m}')">
                      ${METRIC_LABELS[m]} ${getSortIndicator('totalMetric', null, m)}
                    </th>`;
        });
      }
      thead += '</tr></thead>';

      // Hitung Total Keseluruhan Vertikal
      const grandTotalsByCol = {};
      colKeys.forEach(ck => {
        grandTotalsByCol[ck] = { total: 0, uh: 0, transport: 0, penginapan: 0, durasi: 0, count: 0 };
      });
      const overallGrandTotal = { total: 0, uh: 0, transport: 0, penginapan: 0, durasi: 0, count: 0 };

      // Bangun Isi Tabel
      let tbody = '<tbody>';
      participants.forEach(p => {
        const encodedNama = encodeURIComponent(p.nama);
        tbody += '<tr>';
        tbody += `<td class="sticky-col-1">
                    <span class="participant-link" onclick="openParticipantModal('${encodedNama}')" title="${escapeHtml(p.nama)} — Klik untuk melihat rincian">
                      <span class="participant-name-text">${escapeHtml(p.nama)}</span>
                      <span class="trip-pill">${p.rowTotals.count}x</span>
                    </span>
                  </td>`;
        if (showNip) {
          tbody += `<td class="nip-col">${escapeHtml(p.nip || '-')}</td>`;
        }

        if (colDim === 'none') {
          selectedMetrics.forEach(m => {
            const val = p.rowTotals[m];
            overallGrandTotal[m] += val;
            tbody += `<td class="num ${m === 'total' ? 'total-col' : ''} ${val === 0 ? 'zero' : ''}">${formatNumber(val)}</td>`;
          });
        } else {
          colKeys.forEach(ck => {
            const cellGroup = p.byCol[ck] || { total: 0, uh: 0, transport: 0, penginapan: 0, durasi: 0, count: 0 };
            selectedMetrics.forEach(m => {
              const val = cellGroup[m];
              grandTotalsByCol[ck][m] += val;
              tbody += `<td class="num ${val === 0 ? 'zero' : ''}">${formatNumber(val)}</td>`;
            });
          });
          selectedMetrics.forEach(m => {
            const val = p.rowTotals[m];
            overallGrandTotal[m] += val;
            tbody += `<td class="num total-col ${val === 0 ? 'zero' : ''}">${formatNumber(val)}</td>`;
          });
        }
        tbody += '</tr>';
      });

      // Perbarui Strip KPI Header
      document.getElementById('kpiParticipants').textContent = participants.length.toLocaleString('id-ID');
      document.getElementById('kpiTrips').textContent = overallGrandTotal.count.toLocaleString('id-ID');
      document.getElementById('kpiTotal').textContent = 'Rp ' + overallGrandTotal.total.toLocaleString('id-ID');

      // Baris Footer Total Keseluruhan
      tbody += '<tr class="grand-total-row">';
      tbody += `<td class="sticky-col-1" title="Total Keseluruhan (${participants.length} Peserta)">Total (${participants.length} Peserta)</td>`;
      if (showNip) tbody += '<td class="nip-col"></td>';

      if (colDim === 'none') {
        selectedMetrics.forEach(m => {
          tbody += `<td class="num">${formatNumber(overallGrandTotal[m])}</td>`;
        });
      } else {
        colKeys.forEach(ck => {
          selectedMetrics.forEach(m => {
            tbody += `<td class="num">${formatNumber(grandTotalsByCol[ck][m])}</td>`;
          });
        });
        selectedMetrics.forEach(m => {
          tbody += `<td class="num">${formatNumber(overallGrandTotal[m])}</td>`;
        });
      }
      tbody += '</tr></tbody>';

      table.innerHTML = thead + tbody;
    }
  </script>
</body>
</html>
